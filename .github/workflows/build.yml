name: Godot Web and Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35 tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Verify scene and export Web plus Android
        run: python3 scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: LinhDao-Godot-Test
          path: |
            build/android/LinhDao-Godot-Test.apk
            build/LinhDao-Godot-Web-Test.zip
          retention-days: 14
